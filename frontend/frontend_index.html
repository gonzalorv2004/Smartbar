<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>SmartBar</title>
    </head>
    <body style="font-family: Arial; text-align:center; margin-top:50px;">
        <h1>🍺 SmartBar 🚀</h1>
        <br>
        <b>Aqui podemos ver a detalle todos los pedidos que que estan en curso</b>
        <h2>Pedidos en curso</h2>
        <ul id="listaPedidos" style="list-style:none; padding:0;"></ul>
        <br>
        <script>
            // productos (ID = DB)
            const productos = [
                {id:1, nombre:"Cerveza", precio:2.5},
                {id:2, nombre:"Refresco", precio:2.0},
                {id:3, nombre:"ColaCao", precio:4.0},
                {id:4, nombre:"Café", precio:1.5},
                {id:5, nombre:"Perrito", precio:3.5},
                {id:6, nombre:"Montadito", precio:2.5},
                {id:7, nombre:"Hamburguesa", precio:5.0},
                {id:8, nombre:"Pizza", precio:6.5}
            ];
            // 🧾 MOSTRAR RESUMEN
            function actualizarResumen() {
                let resumen = "";
                let total = 0;

                productos.forEach(p => {
                    const cantidad = document.getElementById("p"+p.id).value;

                    if (cantidad > 0) {
                        let subtotal = cantidad * p.precio;
                        total += subtotal;

                        resumen += `${p.nombre} x${cantidad} = ${subtotal.toFixed(2)}€<br>`;
                    }
                });

                document.getElementById("resumen").innerHTML = resumen;
                document.getElementById("total").innerText = "Total: " + total.toFixed(2) + "€";
            }
            // 🚀 ENVIAR PEDIDO
            async function enviarPedido() {

                for (let p of productos) {
                    const cantidad = document.getElementById("p"+p.id).value;

                    if (cantidad > 0) {
                        await fetch("/api/pedido", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({
                                id_producto: p.id,
                                cantidad: cantidad
                            })
                        });
                    }
                }
                alert("Pedido enviado");
                location.reload();
            }
            async function servirPedido(id) {
                await fetch(`/api/pedido/${id}/servido`, {
                    method: "PUT"
                });

                alert("Pedido servido");
                cargarPedidos();
            }
            async function cargarPedidos() {
                const res = await fetch("/api/pedidos");
                const data = await res.json();

                const lista = document.getElementById("listaPedidos");
                lista.innerHTML = "";

                data.forEach(p => {
                    const li = document.createElement("li");

                    li.style.background = "#f2f2f2";
                    li.style.margin = "10px auto";
                    li.style.padding = "10px";
                    li.style.borderRadius = "10px";
                    li.style.width = "350px";

                    li.innerHTML = `
                        Pedido ${p.pedido} - ${p.producto} x${p.cantidad}
                        <br>
                        <button onclick="servirPedido(${p.pedido})">✅ Servido</button>
                    `;

                    lista.appendChild(li);
                });
            }
            setInterval(cargarPedidos, 3000);
            cargarPedidos();
        </script>
    </body>
</html>
