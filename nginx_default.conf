# Redirección HTTP → HTTPS
server {
    listen 80;
    server_name 2asi06.100.30.248.5.nip.io;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name 2asi06.100.30.248.5.nip.io;

    ssl_certificate /etc/letsencrypt/live/2asi06.100.30.248.5.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2asi06.100.30.248.5.nip.io/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/;
    }
}
